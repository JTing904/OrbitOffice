<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OrbitOffice</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 桌面 App 的自定义标题栏（浏览器里不显示） -->
  <div class="titlebar" id="titlebar" hidden>
    <span class="tb-title">ORBIT OFFICE</span>
    <div class="tb-controls">
      <button type="button" id="tb-min" data-i18n-title="tb.min"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 6h8" stroke="currentColor" stroke-width="1.2"/></svg></button>
      <button type="button" id="tb-max" data-i18n-title="tb.max"><svg viewBox="0 0 12 12" fill="none" aria-hidden="true"><rect x="2.5" y="2.5" width="7" height="7" stroke="currentColor" stroke-width="1.2"/></svg></button>
      <button type="button" id="tb-close" class="close" data-i18n-title="tb.close"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7" stroke="currentColor" stroke-width="1.2"/></svg></button>
    </div>
  </div>

  <!-- 全屏 3D 场景（Three.js 不可用时回退为 2D 卡片） -->
  <div class="office" id="office"></div>

  <header class="hud">
    <div class="hud-brand">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M12 2l8.5 5v10L12 22 3.5 17V7L12 2z" stroke="#67e8f9" stroke-width="1.5" stroke-linejoin="round"/>
        <circle cx="12" cy="12" r="3" fill="#67e8f9"/>
      </svg>
      <b>ORBIT OFFICE</b><span class="sep"></span><span class="hq" id="hq"></span>
    </div>

    <nav class="tabs" id="tabs" data-i18n-title="nav.aria">
      <button class="tab active" type="button" data-view="office" data-i18n="nav.office"></button>
      <button class="tab" type="button" data-view="tasks"><span data-i18n="nav.tasks"></span><em id="tab-count" hidden></em></button>
      <button class="tab" type="button" data-view="brain" data-i18n="nav.brain"></button>
      <button class="tab" type="button" data-view="settings" data-i18n="nav.settings"></button>
    </nav>

    <div class="hud-right">
      <div class="stats" id="stats"></div>
      <button class="icon-btn" id="chat-btn" type="button" data-i18n-title="hud.chat">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>
      </button>
      <button class="kbd-btn" id="palette-btn" type="button" data-i18n-title="hud.palette">Ctrl K</button>
      <button class="icon-btn" id="fs" type="button" data-i18n-title="hud.fullscreen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      </button>
    </div>
  </header>

  <!-- 右侧抽屉：任务（看板 / 动态）、员工面板 -->
  <aside class="drawer" id="drawer" aria-hidden="true">
    <div class="drawer-head">
      <span class="eyebrow" id="drawer-title"></span>
      <button class="icon-btn small" id="drawer-close" type="button" data-i18n-title="common.close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="drawer-body">
      <section class="view" id="view-tasks" hidden>
        <div class="subtabs" id="task-tabs">
          <button type="button" class="subtab active" data-sub="board" data-i18n="tasks.board"></button>
          <button type="button" class="subtab" data-sub="log" data-i18n="tasks.log"></button>
        </div>
        <div class="board" id="board"></div>
        <ul class="log" id="log" hidden></ul>
      </section>
      <section class="view" id="view-agent" hidden></section>
    </div>
  </aside>

  <!-- 居中面板：大脑、设置 -->
  <div class="sheet-wrap" id="sheet" aria-hidden="true">
    <div class="sheet" role="dialog" aria-modal="true">
      <div class="sheet-head">
        <span class="eyebrow" id="sheet-title"></span>
        <button class="icon-btn small" id="sheet-close" type="button" data-i18n-title="common.close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div class="sheet-body">
        <section class="view" id="view-brain" hidden></section>
        <section class="view" id="view-settings" hidden></section>
        <section class="view" id="view-task" hidden></section>
      </div>
    </div>
  </div>

  <!-- 指令面板 Ctrl+K -->
  <div class="palette-wrap" id="palette" aria-hidden="true">
    <div class="palette" role="dialog" aria-modal="true">
      <input id="pal-input" type="text" autocomplete="off" spellcheck="false" data-i18n-ph="pal.placeholder">
      <ul id="pal-list"></ul>
    </div>
  </div>

  <!-- 聊天浮窗（目前只有界面，见 chat.js） -->
  <section class="cw" id="chat-win" hidden>
    <div class="cw-head" id="chat-head">
      <div class="cw-title"><b id="chat-title"></b><span id="chat-subtitle"></span></div>
      <span class="grow"></span>
      <button class="icon-btn small" id="chat-min" type="button" data-i18n-title="chat.min"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 12h12"/></svg></button>
      <button class="icon-btn small" id="chat-close" type="button" data-i18n-title="common.close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="cw-spaces" id="chat-spaces"></div>
    <div class="cw-log" id="chat-log"></div>
    <div class="cw-sugg" id="chat-sugg"></div>
    <form class="cw-form" id="chat-form" autocomplete="off">
      <div class="cw-at" id="chat-at" hidden></div>
      <input id="chat-input" type="text" maxlength="300">
      <button class="send" type="submit" data-i18n-title="chat.send"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
    </form>
    <span class="cw-resize" id="chat-resize"></span>
  </section>
  <button class="pill" id="chat-pill" type="button" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>
    <span id="chat-pill-text"></span>
  </button>

  <!-- 员工提问 / 请求批准 -->
  <div class="palette-wrap ask-wrap" id="ask" aria-hidden="true">
    <div class="ask" role="dialog" aria-modal="true">
      <div class="ask-head"><span class="av" id="ask-av"></span><b id="ask-who"></b><span class="eyebrow" id="ask-kind"></span></div>
      <p class="ask-text" id="ask-text"></p>
      <textarea id="ask-input" rows="3"></textarea>
      <div class="ask-actions"><button class="ghost" id="ask-no" type="button"></button><button class="primary" id="ask-yes" type="button"></button></div>
    </div>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>
  <nav class="minimap" id="minimap" data-i18n-title="map.aria"></nav>

  <!-- 底部指令栏：权限模式 + 派发任务 -->
  <form class="command" id="task-form" autocomplete="off">
    <div class="cmd-top">
      <div class="modes" id="modes" role="group" data-i18n-title="mode.aria"></div>
      <span class="mode-hint" id="mode-hint"></span>
    </div>
    <div class="cmd-main">
      <input id="task-title" type="text" maxlength="80" required data-i18n-ph="cmd.placeholder">
      <select id="task-agent" data-i18n-title="cmd.agent"></select>
      <label class="switch" data-i18n-title="cmd.handoff.title">
        <input type="checkbox" id="task-handoff" checked>
        <span class="track"></span><em data-i18n="cmd.handoff"></em>
      </label>
      <button class="send" type="submit" data-i18n-title="cmd.send">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
      </button>
    </div>
    <div class="examples" id="examples"></div>
  </form>

  <p class="hint-corner" data-i18n="hint.corner"></p>

  <script src="vendor/three.min.js"></script>
  <script src="vendor/OrbitControls.js"></script>
  <script src="vendor/GLTFLoader.js"></script>
  <script src="assets/models.js"></script>
  <script src="i18n.js"></script>
  <script src="office3d.js"></script>
  <script src="chat.js"></script>
  <script src="ui.js"></script>
  <script src="office-def.js"></script>
  <script src="office-ui.js"></script>
  <script src="app.js"></script>
</body>
</html>
